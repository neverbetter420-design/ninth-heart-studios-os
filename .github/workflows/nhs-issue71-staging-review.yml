name: NHS Issue 71 staging review HTTP safety source checks

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'proxy.ts'
      - 'app/auth/sign-in/page.tsx'
      - 'app/auth/review-sign-in/route.ts'
      - 'app/auth/sign-out/route.ts'
      - 'app/auth/callback/route.ts'
      - 'lib/staging-read-only.ts'
      - 'wrangler.velvet-atelier-admin-preview.jsonc'
      - 'scripts/verify-staging-readonly.mjs'
      - 'scripts/verify-staging-db-audit.mjs'
      - 'scripts/sql/issue71-staging-acl-audit.sql'
      - 'scripts/sql/issue71-staging-readonly-acceptance.sql'
      - 'scripts/sql/issue71-staging-acl-snapshot.sql'
      - 'scripts/sql/issue71-staging-acl-drift-checkpoint.sql'
      - 'scripts/verify-staging-acl-checkpoint.mjs'
      - 'scripts/sql/issue71-staging-permission-origins.sql'
      - 'scripts/verify-staging-permission-origins.mjs'
      - 'scripts/verify-issue71-authorized-public-freeze.mjs'
      - 'docs/security/issue71-authorized-staging-public-acl-baseline.md'
      - 'docs/security/issue71-authorized-staging-public-freeze.sql'
      - 'docs/security/issue71-authorized-staging-public-rollback.sql'
      - 'docs/security/issue71-permission-origin-review.md'
      - 'docs/security/issue71-stage-freeze-approval-gates.md'
      - 'docs/security/issue71-staging-database-write-freeze.md'
      - 'scripts/verify-cloudflare-runtime.mjs'
      - '.github/workflows/nhs-issue71-staging-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-readonly-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code; no persistent Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify preview-only fail-closed request policy without network or databases
        run: node --experimental-strip-types scripts/verify-staging-readonly.mjs
      - name: Prove staged database ACL audit is metadata-only and not applied
        run: node scripts/verify-staging-db-audit.mjs
      - name: Verify nine-section read-only rollback drift checkpoint
        run: node scripts/verify-staging-acl-checkpoint.mjs
      - name: Verify exact staging grantor inventory without SQL writes
        run: node scripts/verify-staging-permission-origins.mjs
      - name: Verify exact scope and inverse of staged public ACL freeze
        run: node scripts/verify-issue71-authorized-public-freeze.mjs
      - name: Check full application types without deployment
        run: |
          npm ci
          npm run typecheck
      - name: Record read-only workflow boundaries
        run: |
          echo 'Source-only PR gate; no Worker deployment, Supabase SQL, action POST, auth provisioning or production changes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This HTTP barrier does not restrict direct browser-to-Supabase REST calls; RLS/restricted grants are a separate unresolved gate.' >> "$GITHUB_STEP_SUMMARY"
