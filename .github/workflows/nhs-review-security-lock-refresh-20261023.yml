name: NHS review branch one-time security lockfile refresh
on:
  push:
    branches:
      - design/soft-welcome-atelier-20261023
    paths:
      - package.json
permissions:
  contents: write
jobs:
  update-lockfile:
    if: github.repository == 'neverbetter420-design/ninth-heart-studios-os'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved draft branch
        uses: actions/checkout@v4
        with:
          ref: design/soft-welcome-atelier-20261023
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched security dependencies
        run: |
          node - <<'NODE'
          const p=require('./package.json');
          if (p.overrides?.['body-parser'] !== '2.4.0' ||
              p.overrides?.miniflare?.undici !== '7.30.1' ||
              p.dependencies.nodemailer !== '^10.2.1') process.exit(1);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const p=require('./package-lock.json').packages;
          const found={
            'body-parser':p['node_modules/body-parser']?.version,
            'miniflare/undici':p['node_modules/miniflare/node_modules/undici']?.version || p['node_modules/undici']?.version,
            'nodemailer':p['node_modules/nodemailer']?.version,
          };
          console.log(found);
          if(found['body-parser']!=='2.4.0' ||
             found['miniflare/undici']!=='7.30.1' ||
             !/^10\.(?:[2-9]|[1-9][0-9])\./.test(found.nodemailer||''))process.exit(1);
          NODE
          npm audit --audit-level=high
      - name: Commit only validated lockfile to review branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock patched body-parser undici and Nodemailer"
          git push origin HEAD:refs/heads/design/soft-welcome-atelier-20261023
