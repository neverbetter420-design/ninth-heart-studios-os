name: NHS OS patched glob dependency lock probe (no deploy)

# Issue #23. One-time read-only CI probe to prove the OpenNext compatibility
# fix can coexist with a clean high/critical audit. No repo write token.
on:
  pull_request:
    paths:
      - '.github/workflows/issue23-lock-remediation.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  locked-dependency-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://rquscwgdrqkzwjukiqtk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7N1_IhU0_mvs6q0ppgyssA_0O6xj-L2
      NHS_APP_URL: https://app.ninthheartstudios.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile with patched nested glob (runner only)
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify fresh locked install
        run: npm ci
      - name: Reject security advisories rated high or critical
        run: npm audit --audit-level=high
      - name: Confirm exact OpenNext and nested patched glob packages
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const adapter = read('node_modules/@opennextjs/cloudflare/package.json');
          const nested = read('node_modules/@node-minify/core/node_modules/glob/package.json');
          if (adapter.version !== '1.20.12' || nested.version !== '10.5.0') {
            throw new Error('Locked versions unexpected: ' + adapter.version + ', ' + nested.version);
          }
          console.log('PASS locked adapter',adapter.version,'with patched node-minify glob',nested.version);
          NODE
      - name: Build approved Seven Rooms Cloudflare Worker
        run: npm run cf:build
      - name: Verify compiled Worker HTTP 200 without deploying
        run: node scripts/verify-cloudflare-runtime.mjs
      - name: Export locked manifest for source-controlled PR (public dependency metadata only)
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const name = 'package-lock.json';
          const value = fs.readFileSync(name,'utf8');
          let count=0;
          for(let pos=0;pos<value.length;pos+=3500){
            console.log('NHS_PATCHED_LOCK_CHUNK:'+String(count++).padStart(4,'0')+':'+JSON.stringify(value.slice(pos,pos+3500)));
          }
          console.log('NHS_PATCHED_LOCK_END:'+value.length+':'+count);
          NODE
      - name: Confirm no external changes
        run: echo "NPM lock experiment in CI only; no production deploy, credentials, data changes or repo writes." >> "$GITHUB_STEP_SUMMARY"
