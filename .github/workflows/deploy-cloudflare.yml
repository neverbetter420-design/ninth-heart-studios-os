name: Deploy NHS OS to Cloudflare (manual)

# Intentionally NOT triggered by push. The live Worker and existing client
# sessions must not be replaced until email and auth configuration are verified.
on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Explicit owner approval for production Worker deployment"
        required: true
        type: string
      expected_main_sha:
        description: "Exact 40-character reviewed main commit SHA"
        required: true
        type: string
      verified_security_migration:
        description: "Confirm production Supabase policy post-check was completed"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nhs-os-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'neverbetter420-design' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rquscwgdrqkzwjukiqtk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7N1_IhU0_mvs6q0ppgyssA_0O6xj-L2
      NHS_APP_URL: https://app.ninthheartstudios.com
      CLOUDFLARE_ACCOUNT_ID: 1cab715a285ef1f9cabff977ccda18da
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
      - name: Fail closed unless reviewed release is explicitly authorized
        shell: bash
        env:
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          VERIFIED_SECURITY_MIGRATION: ${{ inputs.verified_security_migration }}
        run: |
          set -euo pipefail
          if [[ "$APPROVAL_PHRASE" != "I_APPROVE_NHS_OS_PRODUCTION_DEPLOY" ]]; then
            echo "::error::Exact production deployment approval phrase is required."
            exit 1
          fi
          if [[ ! "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::The reviewed main SHA must exactly match the deployed commit."
            exit 1
          fi
          if [[ "$VERIFIED_SECURITY_MIGRATION" != "I_VERIFIED_SUPABASE_HARDENING" ]]; then
            echo "::error::Confirm the active Supabase migration post-check before deploying."
            exit 1
          fi
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preflight Cloudflare credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the production GitHub environment before deploying."
            exit 1
          fi
      - name: Install locked packages
        run: npm ci
      - name: Verify TypeScript and password recovery
        run: |
          npm run typecheck
          npm run verify:password-recovery
      - name: Build Cloudflare Worker
        run: npm run cf:build
      - name: Check Worker output (no publish)
        run: npm run cf:dry-run
      - name: Deploy approved bundle
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Diagnose Cloudflare metadata (read only)
        if: failure()
        run: node scripts/diagnose-cloudflare-metadata.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Inspect deployment in Cloudflare
        run: npx wrangler deployments list --name ninth-heart-studios-os
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
