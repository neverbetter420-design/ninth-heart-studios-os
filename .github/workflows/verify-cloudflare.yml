name: NHS OS Cloudflare bundle verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rquscwgdrqkzwjukiqtk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7N1_IhU0_mvs6q0ppgyssA_0O6xj-L2
      NHS_APP_URL: https://app.ninthheartstudios.com
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build real OpenNext Worker bundle
        run: npm run cf:build
      - name: Validate Wrangler Worker bundle without deploying
        run: npm run cf:dry-run
      - name: Test compiled Cloudflare Worker HTTP routes in local workerd
        run: node scripts/verify-cloudflare-runtime.mjs

